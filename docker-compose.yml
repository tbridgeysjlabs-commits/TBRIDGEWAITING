services:
  db:
    image: postgres:16-alpine
    container_name: tbridge-waiting-db
    environment:
      POSTGRES_USER: tbridge
      POSTGRES_PASSWORD: tbridge
      POSTGRES_DB: tbridge_waiting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbridge -d tbridge_waiting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
